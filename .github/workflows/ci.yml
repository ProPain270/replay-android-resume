name: Native contract tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/test_public_export.py
      - run: python3 tools/check_public_export.py
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [native, corelab]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S ${{ matrix.module }} -B build/${{ matrix.module }}
      - run: cmake --build build/${{ matrix.module }} --parallel
      - run: ctest --test-dir build/${{ matrix.module }} --output-on-failure
